name: Build macOS App
 
on:
  push:
    tags:
      - "v*"           # triggers on version tags like v1.0, v1.2.3
  workflow_dispatch:   # also allows manual trigger from GitHub Actions tab
 
jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write 
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install pynput    # required by quicktype.py
 
      - name: Clean previous build artifacts
        run: rm -rf build/ dist/
 
      - name: Build .app with PyInstaller
        run: pyinstaller quicktype_macos.spec
 
      - name: Verify .app was created
        run: |
          if [ ! -d "dist/QuickType.app" ]; then
            echo "ERROR: QuickType.app was not found in dist/"
            exit 1
          fi
          echo "QuickType.app built successfully."
 
      - name: Zip the .app for distribution
        run: |
          cd dist
          zip -r QuickType-macOS.zip QuickType.app
 
      - name: Upload build artifact (for manual/push builds)
        uses: actions/upload-artifact@v4
        with:
          name: QuickType-macOS
          path: dist/QuickType-macOS.zip
          retention-days: 14
 
      - name: Attach .zip to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuickType-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}